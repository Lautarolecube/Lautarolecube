    <text x="32" y="214" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">I design and build digital solutions</text><text x="32" y="246" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">that transform opportunities into</text><text x="32" y="278" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">scalable products, processes</text><text x="32" y="310" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="22" font-weight="500" letter-spacing="0" text-anchor="start">and experiences.</text>
