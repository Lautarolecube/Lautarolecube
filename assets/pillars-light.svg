<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img">
  <style>
    .motion-dash { stroke-dasharray: 5 7; animation: march 9s linear infinite; }
    .motion-dot { animation: pulse 2.8s ease-in-out infinite; }
    .motion-cursor { animation: blink 1.15s steps(1) infinite; }
    @keyframes march { to { stroke-dashoffset: -96; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes blink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .motion-dash, .motion-dot, .motion-cursor { animation: none; }
    }
  </style>
  <rect width="880" height="400" fill="#F4F7FB"/>
  <rect x="0.5" y="0.5" width="879" height="399" fill="none" stroke="#D3DCE8"/>
  
    <text x="24" y="36" fill="#5C6B82" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" letter-spacing="0.6" text-anchor="start">TECHNOLOGY  ×  PRODUCT  ×  AUTOMATION  ×  BUSINESS</text>
    <line x1="430" y1="224" x2="450" y2="224" stroke="#3478F6" stroke-width="1.5"/>
    <line x1="440" y1="214" x2="440" y2="234" stroke="#3478F6" stroke-width="1.5"/>
    <circle class="motion-dot" cx="440" cy="224" r="2.5" fill="#3478F6"/>
    
      <rect x="24" y="64" width="406" height="150" fill="#FFFFFF" stroke="#D3DCE8"/>
      <text x="46" y="100" fill="#3478F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.2" text-anchor="start">01</text>
      <text x="46" y="132" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="28" font-weight="640" letter-spacing="0" text-anchor="start">Technology</text>
      <text x="46" y="160" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Software engineering</text><text x="46" y="184" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">and architecture</text>
    
      <rect x="450" y="64" width="406" height="150" fill="#FFFFFF" stroke="#D3DCE8"/>
      <text x="472" y="100" fill="#3478F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.2" text-anchor="start">02</text>
      <text x="472" y="132" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="28" font-weight="640" letter-spacing="0" text-anchor="start">Product</text>
      <text x="472" y="160" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Digital products and</text><text x="472" y="184" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">product engineering</text>
    
      <rect x="24" y="234" width="406" height="150" fill="#FFFFFF" stroke="#D3DCE8"/>
      <text x="46" y="270" fill="#3478F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.2" text-anchor="start">03</text>
      <text x="46" y="302" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="28" font-weight="640" letter-spacing="0" text-anchor="start">Automation</text>
      <text x="46" y="330" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Workflows, integrations,</text><text x="46" y="354" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">and event-driven systems</text>
    
      <rect x="450" y="234" width="406" height="150" fill="#FFFFFF" stroke="#D3DCE8"/>
      <text x="472" y="270" fill="#3478F6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="500" letter-spacing="1.2" text-anchor="start">04</text>
      <text x="472" y="302" fill="#101827" font-family="system-ui, Segoe UI, sans-serif" font-size="28" font-weight="640" letter-spacing="0" text-anchor="start">Business</text>
      <text x="472" y="330" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">Digital business and</text><text x="472" y="354" fill="#5C6B82" font-family="system-ui, Segoe UI, sans-serif" font-size="18" font-weight="500" letter-spacing="0" text-anchor="start">entrepreneurship</text>
    
  
